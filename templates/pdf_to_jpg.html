{% extends "base.html" %}
{% block title %}PDF to JPG · Word → PDF Editor{% endblock %}
{% block content %}
  <section class="editor-toolbar">
    <a class="back-link" href="{{ url_for('tools_hub') }}"><svg class="icon"><use href="#icon-arrow-left"/></svg> Back</a>
    <h2>PDF to JPG</h2>
  </section>

  <div class="action-card tool-form-card">
    <span class="action-icon"><svg class="icon"><use href="#icon-image"/></svg></span>
    <p class="hint">Every page is exported as a JPG. More than one page downloads as a zip.</p>
    <form action="/tools/pdf-to-jpg" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept=".pdf" required>
      <button class="btn btn-primary btn-block" type="submit">
        <svg class="icon"><use href="#icon-image"/></svg> Convert
      </button>
    </form>
  </div>
{% endblock %}
