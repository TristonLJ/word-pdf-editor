{% extends "base.html" %}
{% block title %}Organize PDF · Word → PDF Editor{% endblock %}
{% block content %}
  <section class="editor-toolbar">
    <a class="back-link" href="{{ url_for('tools_hub') }}"><svg class="icon"><use href="#icon-arrow-left"/></svg> Back</a>
    <h2>Organize PDF</h2>
  </section>

  <div class="action-card tool-form-card">
    <span class="action-icon"><svg class="icon"><use href="#icon-grid"/></svg></span>
    <p class="hint">Upload a PDF, then reorder, rotate, or remove its pages.</p>
    <form action="/tools/organize-pdf" method="post" enctype="multipart/form-data">
      <input type="file" name="file" accept=".pdf" required>
      <button class="btn btn-primary btn-block" type="submit">
        <svg class="icon"><use href="#icon-grid"/></svg> Upload &amp; organize
      </button>
    </form>
  </div>
{% endblock %}
